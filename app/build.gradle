apply plugin: 'com.android.application'

apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.odom.motivationlocker"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.odom.motivationlocker"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 13
        versionName "1.11"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions{
        sourceCompatibility 17
        targetCompatibility 17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            // android.util.Log 등 android.jar의 스텁 메서드가 로컬 JVM 테스트에서
            // 예외를 던지는 대신 기본값을 반환하도록 함(QuoteRepositoryTest의 Log.w 호출 등)
            returnDefaultValues = true
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    // JVM 단위 테스트에서 org.json을 실제로 동작시키기 위함(안드로이드 SDK의 org.json 스텁은 로컬 테스트에서 예외를 던짐)
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    implementation 'com.google.android.gms:play-services-ads-identifier:17.0.0'

    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
